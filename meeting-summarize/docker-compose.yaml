services:
  vllm-asr:
    build:
      context: .
      dockerfile: Dockerfile.asr
    image: inference-hub/vllm-asr:latest
    container_name: vllm-asr
    profiles: ["transcribe"]
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      # Use only the local cache, no outbound traffic. To add a new model,
      # remove this, start it once to download, then put it back.
      - HF_HUB_OFFLINE=1
      - VLLM_ATTENTION_BACKEND=TRITON_ATTN
      # Defaults are 25 MB / 600 s, meant for short clips. A meeting arrives as
      # a single 16 kHz mono WAV (~115 MB/h), so both have to go up together.
      - VLLM_MAX_AUDIO_CLIP_FILESIZE_MB=1024
      - VLLM_MAX_AUDIO_DECODE_DURATION_S=21600
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    ports:
      - "8001:8000"
    command:
      - --model=openai/whisper-large-v3
      # Memoria unificada: este porcentaje sale de los 128 GB del sistema,
      # no de una VRAM aparte. Whisper-large-v3 son ~3 GB de pesos.
      - --gpu-memory-utilization=0.15
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  pipeline:
    build:
      context: ./pipeline
    image: inference-hub/meeting-pipeline:latest
    container_name: meeting-pipeline
    profiles: ["transcribe"]
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - ASR_URL=http://vllm-asr:8000/v1/audio/transcriptions
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    ports:
      - "8002:8000"
    depends_on:
      - vllm-asr
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-summarize:
    image: vllm/vllm-openai:latest
    container_name: vllm-summarize
    profiles: ["summarize"]
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    ports:
      - "8003:8000"
    command:
      - --model=Qwen/Qwen2.5-72B-Instruct-AWQ
      - --quantization=awq
      # ~42 GB of weights + activations; the rest of the budget goes to KV cache.
      # Leaves room for vllm-asr (0.15) and the system in unified memory.
      - --gpu-memory-utilization=0.50
      - --max-model-len=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
